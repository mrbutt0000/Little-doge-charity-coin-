<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐶 LDOGE</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body{background:#0b0e11;color:#fff;font-family:sans-serif;padding:20px}
        .card{background:#1e2329;padding:20px;border-radius:16px;margin-bottom:16px}
        .glow-btn{background:#f0b90b;color:#000;border:none;font-weight:800;padding:16px;border-radius:60px;font-size:16px;width:100%;cursor:pointer}
        .glow-btn:disabled{opacity:0.4}
        .big-num{font-size:36px;font-weight:900}
        .debug{background:#13181d;padding:12px;border-radius:10px;font-family:monospace;font-size:13px;margin-bottom:16px;border-left:3px solid #f0b90b;min-height:50px;white-space:pre-wrap}
        .debug.error{border-left-color:#ff4444;color:#ff4444}
        .debug.success{border-left-color:#3ddc84;color:#3ddc84}
        .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
        .stat-box{background:#13181d;padding:12px;border-radius:12px;text-align:center}
        .stat-box .num{font-size:18px;font-weight:800}
        .stat-box .label{font-size:9px;color:#848e9c}
        .text-muted{color:#848e9c}
    </style>
</head>
<body>

<div id="log" class="debug">⏳ Starting...</div>

<div class="card">
    <h2 style="color:#f0b90b;">💰 Dashboard</h2>
    <div style="text-align:center;">
        <div class="big-num" id="bal">0.00</div>
        <div style="color:#848e9c;">$LDOGE Balance</div>
    </div>
    <button class="glow-btn" id="mineBtn">⛏️ Mine (5 Coins)</button>
    <div id="timer" style="text-align:center;margin-top:12px;color:#848e9c;">✅ Ready</div>
    <div class="stat-grid">
        <div class="stat-box"><div class="num" id="mined">0</div><div class="label">Mined</div></div>
        <div class="stat-box"><div class="num" id="lvl">Silver</div><div class="label">Level</div></div>
        <div class="stat-box"><div class="num" id="refs">0</div><div class="label">Referrals</div></div>
    </div>
</div>

<div class="card">
    <h2 style="color:#f0b90b;">🎁 Welcome</h2>
    <p class="text-muted" id="wmsg">Claim 20 $LDOGE!</p>
    <button class="glow-btn" id="wbtn" style="background:#3ddc84;">🎁 Claim</button>
</div>

<script>
// ============================================
// STEP 1: Debug function (works immediately)
// ============================================
function log(msg, type) {
    var el = document.getElementById('log');
    if (!el) return;
    var t = new Date().toLocaleTimeString();
    el.innerText = '[' + t + '] ' + msg;
    el.className = 'debug' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
    console.log(msg);
}

log('🚀 Script started');

// ============================================
// STEP 2: Firebase config
// ============================================
var config = {
    apiKey: "AIzaSyBr3myUI6FhyShlG5lrD_8LZtzvXszK2xw",
    authDomain: "cyrusprotocol-b3080.firebaseapp.com",
    databaseURL: "https://cyrusprotocol-b3080-default-rtdb.firebaseio.com",
    projectId: "cyrusprotocol-b3080",
    storageBucket: "cyrusprotocol-b3080.firebasestorage.app",
    messagingSenderId: "457843406848",
    appId: "1:457843406848:web:1e345eb2a0ce1a2bf280e5"
};

log('⏳ Initializing Firebase...');

try {
    var app = firebase.initializeApp(config);
    var db = firebase.database();
    log('✅ Firebase connected!', 'success');
} catch(e) {
    log('❌ Firebase error: ' + e.message, 'error');
    alert('Firebase error: ' + e.message);
}

// ============================================
// STEP 3: Telegram user
// ============================================
log('⏳ Getting Telegram user...');

var tg = window.Telegram?.WebApp;
var user = null;
if (tg) {
    tg.expand();
    user = tg.initDataUnsafe?.user;
}
if (!user) {
    user = { id: 123456789, first_name: "Test" };
    log('⚠️ Browser mode (test user)', 'error');
}

var userId = user.id.toString();
log('👤 User ID: ' + userId);

// ============================================
// STEP 4: Load user data
// ============================================
var userRef = db ? db.ref('users/' + userId) : null;
var data = null;
var COOLDOWN = 3 * 60 * 60 * 1000;

function $(id) { return document.getElementById(id); }

function updateUI() {
    if (!data) return;
    $('bal').innerText = (data.balance || 0).toFixed(2);
    $('mined').innerText = data.minedCoins || 0;
    $('refs').innerText = data.referralCount || 0;
    
    if (data.hasClaimedWelcome) {
        $('wbtn').disabled = true;
        $('wbtn').innerText = '✅ Claimed';
        $('wmsg').innerText = 'Welcome bonus claimed!';
    } else {
        $('wbtn').disabled = false;
        $('wbtn').innerText = '🎁 Claim 20 Coins';
        $('wmsg').innerText = 'Claim your 20 $LDOGE!';
    }
    
    // Cooldown check
    var last = data.lastClaimTime || 0;
    var diff = Date.now() - last;
    if (diff >= COOLDOWN) {
        $('mineBtn').disabled = false;
        $('timer').innerText = '✅ Ready';
    } else {
        $('mineBtn').disabled = true;
        var rem = COOLDOWN - diff;
        var h = Math.floor(rem/3600000);
        var m = Math.floor((rem%3600000)/60000);
        var s = Math.floor((rem%60000)/1000);
        $('timer').innerText = '⏳ ' + h + 'h ' + m + 'm ' + s + 's';
        setTimeout(updateUI, 1000);
    }
    
    log('✅ UI updated', 'success');
}

function saveData() {
    if (!data || !userRef) return;
    if (userId === "123456789") {
        try { localStorage.setItem('ldoge_test', JSON.stringify(data)); } catch(e) {}
        return;
    }
    userRef.set(data).then(function() {
        log('✅ Saved');
    }).catch(function(e) {
        log('❌ Save error: ' + e.message, 'error');
    });
}

function loadData() {
    if (!userRef) {
        log('❌ No userRef', 'error');
        return;
    }
    
    // Test user
    if (userId === "123456789") {
        log('🔍 Test user mode');
        var local = localStorage.getItem('ldoge_test');
        if (local) {
            try { data = JSON.parse(local); } catch(e) {}
        }
        if (!data) {
            data = {
                balance: 0,
                minedCoins: 0,
                hasClaimedWelcome: false,
                walletSolana: '',
                walletBase: '',
                referralCount: 0,
                lastClaimTime: 0,
                tasksClaimed: {},
                tasksPending: {}
            };
        }
        updateUI();
        log('✅ Test user loaded', 'success');
        return;
    }
    
    log('⏳ Loading user from Firebase...');
    userRef.once('value').then(function(snap) {
        var val = snap.val();
        if (!val) {
            log('🆕 Creating new user');
            data = {
                firstName: user.first_name || 'User',
                balance: 0,
                minedCoins: 0,
                hasClaimedWelcome: false,
                walletSolana: '',
                walletBase: '',
                referralCount: 0,
                referralList: [],
                referredBy: null,
                lastClaimTime: 0,
                lastLoginDate: new Date().toISOString().split('T')[0],
                missedDays: 0,
                tasksClaimed: {},
                tasksPending: {},
                totalBurned: 0
            };
            userRef.set(data);
            updateUI();
            log('✅ New user created', 'success');
        } else {
            data = val;
            updateUI();
            log('✅ User loaded', 'success');
        }
    }).catch(function(e) {
        log('❌ Load error: ' + e.message, 'error');
        alert('Load error: ' + e.message + '\nCheck Authorized Domains!');
    });
}

// ============================================
// STEP 5: Mine function
// ============================================
function mine() {
    log('⛏️ Mine clicked');
    if (!data) return;
    var now = Date.now();
    if (now - (data.lastClaimTime || 0) < COOLDOWN) {
        $('timer').innerText = '⏳ Wait!';
        return;
    }
    data.balance = (data.balance || 0) + 5;
    data.minedCoins = (data.minedCoins || 0) + 5;
    data.lastClaimTime = now;
    saveData();
    updateUI();
    $('timer').innerText = '✅ Mined!';
    $('mineBtn').disabled = true;
    setTimeout(updateUI, 1000);
}

// ============================================
// STEP 6: Welcome function
// ============================================
function claimWelcome() {
    log('🎁 Welcome clicked');
    if (!data || data.hasClaimedWelcome) return;
    data.balance = (data.balance || 0) + 20;
    data.hasClaimedWelcome = true;
    saveData();
    updateUI();
}

// ============================================
// STEP 7: Attach events
// ============================================
$('mineBtn').onclick = mine;
$('wbtn').onclick = claimWelcome;

// ============================================
// STEP 8: START
// ============================================
if (db) {
    loadData();
    log('✅ App ready', 'success');
} else {
    log('❌ Firebase not ready', 'error');
    alert('Firebase not initialized. Check Authorized Domains.');
}
</script>
</body>
    </html>
