<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>LITTLE DOGE - $LDOGE Mining</title>
    
    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    
    <!-- TELEGRAM WEB APP -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #ffd700;
            --bg-dark: #0f0f1e;
            --bg-card: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --success: #00ff88;
            --danger: #ff6b6b;
            --border: rgba(102, 126, 234, 0.15);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(180deg, var(--bg-dark) 0%, #1a1a2e 100%);
            color: var(--text-primary);
        }
        
        body {
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
        }
        
        .app-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        
        .app-container::-webkit-scrollbar {
            width: 4px;
        }
        
        .app-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .app-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 2px;
        }
        
        .page {
            display: none;
            min-height: 100vh;
            animation: fadeIn 0.4s ease;
        }
        
        .page.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* ========== HEADER ========== */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 16px;
            margin-bottom: 8px;
            box-shadow: var(--shadow);
            border-radius: 0 0 20px 20px;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .header-logo {
            font-size: 28px;
            font-weight: 700;
        }
        
        .header-user {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        
        .balance-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        
        .balance-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 4px;
        }
        
        .balance-amount {
            font-size: 42px;
            font-weight: 900;
            color: var(--accent);
            font-family: 'Courier New', monospace;
            text-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
        }
        
        .level-info {
            font-size: 11px;
            margin-top: 8px;
            opacity: 0.8;
        }
        
        /* ========== MINING SECTION ========== */
        .mining-section {
            padding: 16px;
        }
        
        .mining-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26, 26, 46, 0.8) 100%);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        
        .mining-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .countdown-display {
            font-size: 48px;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            color: var(--accent);
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(255, 215, 0, 0.2);
            letter-spacing: 2px;
        }
        
        .countdown-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        
        .pending-display {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }
        
        .pending-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .pending-amount {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .multiplier-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .claim-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent) 0%, #ffed4e 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px rgba(255, 215, 0, 0.2);
        }
        
        .claim-btn:active {
            transform: scale(0.98);
        }
        
        .claim-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: linear-gradient(135deg, #999 0%, #777 100%);
            box-shadow: none;
        }
        
        /* ========== STATS GRID ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26, 26, 46, 0.8) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .stat-box:active {
            transform: scale(0.98);
        }
        
        .stat-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Courier New', monospace;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* ========== BOTTOM NAV ========== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0;
            z-index: 1000;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.3);
        }
        
        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 10px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        
        .nav-btn.active {
            color: var(--accent);
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-icon {
            font-size: 24px;
        }
        
        /* ========== PAGE CONTENT ========== */
        .page-content {
            padding: 16px;
            padding-bottom: 100px;
        }
        
        .content-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        
        /* ========== TASK ITEM ========== */
        .task-item {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26, 26, 46, 0.8) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: all 0.3s;
        }
        
        .task-item.completed {
            opacity: 0.6;
        }
        
        .task-icon {
            font-size: 32px;
            flex-shrink: 0;
        }
        
        .task-info {
            flex: 1;
        }
        
        .task-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        
        .task-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .task-reward {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
        }
        
        .task-btn {
            padding: 8px 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }
        
        .task-btn:active {
            background: var(--secondary);
        }
        
        .task-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--text-secondary);
        }
        
        /* ========== REFERRAL SECTION ========== */
        .referral-box {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.2);
        }
        
        .referral-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .referral-bonus {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 16px;
        }
        
        .referral-link {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .referral-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .ref-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .ref-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* ========== REFERRAL STATS ========== */
        .referral-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }
        
        .ref-stat {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26, 26, 46, 0.8) 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        
        .ref-stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Courier New', monospace;
        }
        
        .ref-stat-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            text-transform: uppercase;
        }
        
        /* ========== WALLET INPUT ========== */
        .wallet-input-group {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26, 26, 46, 0.8) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .wallet-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .wallet-input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 12px;
            font-family: 'Courier New', monospace;
            margin-bottom: 8px;
        }
        
        .wallet-input::placeholder {
            color: var(--text-secondary);
        }
        
        .wallet-btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .wallet-btn:active {
            background: var(--secondary);
        }
        
        .wallet-status {
            font-size: 11px;
            margin-top: 6px;
            color: var(--text-secondary);
        }
        
        .wallet-status.connected {
            color: var(--success);
        }
        
        /* ========== PROFILE STATS ========== */
        .profile-stat-group {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26, 26, 46, 0.8) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .profile-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .profile-stat:last-child {
            border-bottom: none;
        }
        
        .profile-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .profile-stat-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Courier New', monospace;
        }
        
        /* ========== ANIMATIONS ========== */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        
        /* ========== MESSAGES ========== */
        .message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2000;
            animation: slideDown 0.3s ease;
            max-width: 90%;
        }
        
        .message.success {
            background: var(--success);
            color: #000;
        }
        
        .message.error {
            background: var(--danger);
            color: white;
        }
        
        @keyframes slideDown {
            from {
                transform: translate(-50%, -100%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }
        
        /* ========== RESPONSIVE ========== */
        @media (max-width: 380px) {
            .balance-amount {
                font-size: 36px;
            }
            
            .countdown-display {
                font-size: 40px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- APP CONTAINER -->
    <div class="app-container">
        <!-- ========== HOME PAGE ========== -->
        <div id="home-page" class="page active">
            <div class="header">
