<!DOCTYPE html>
<html>
<head>
    <title>🔍 Firebase Test</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
    </script>
    <style>
        body {
            background: #0b0e11;
            color: #eaecef;
            font-family: monospace;
            padding: 30px;
        }
        .box {
            background: #1e2329;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2b3139;
            max-width: 700px;
            margin: 0 auto;
        }
        .success {
            color: #3ddc84;
        }
        .error {
            color: #ff4444;
        }
        button {
            background: #f0b90b;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            margin-top: 16px;
        }
        pre {
            background: #13181d;
            padding: 16px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔥 Firebase Connection Test</h2>
        <div id="status">⏳ Initializing...</div>
        <div id="detail"></div>
        <button onclick="runTest()">🔄 Run Test Again</button>
    </div>

    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBr3myUI6FhyShlG5lrD_8LZtzvXszK2xw",
            authDomain: "cyrusprotocol-b3080.firebaseapp.com",
            databaseURL: "https://cyrusprotocol-b3080-default-rtdb.firebaseio.com",
            projectId: "cyrusprotocol-b3080",
            storageBucket: "cyrusprotocol-b3080.firebasestorage.app",
            messagingSenderId: "457843406848",
            appId: "1:457843406848:web:1e345eb2a0ce1a2bf280e5"
        };

        function log(msg, isError) {
            var statusEl = document.getElementById('status');
            var detailEl = document.getElementById('detail');
            statusEl.innerText = msg;
            statusEl.className = isError ? 'error' : 'success';
            detailEl.innerText = '';
            console.log(msg);
        }

        function runTest() {
            log('⏳ Testing Firebase connection...', false);
            try {
                var app = firebase.initializeApp(firebaseConfig);
                var db = firebase.database();
                log('✅ Firebase initialized successfully!', false);

                // Try to read/write test data
                var testRef = db.ref('test_connection/' + Date.now());
                testRef.set({ timestamp: Date.now(), status: 'ok' })
                    .then(function() {
                        log('✅ Write test successful!', false);
                        return testRef.remove();
                    })
                    .then(function() {
                        log('✅ Read/Write test PASSED! Firebase is fully connected.', false);
                        document.getElementById('detail').innerHTML =
                            '<pre class="success">✅ Everything works! Your app should run fine now.</pre>';
                    })
                    .catch(function(err) {
                        log('❌ Database write failed: ' + err.message, true);
                        document.getElementById('detail').innerHTML =
                            '<pre class="error">❌ Error: ' + err.message +
                            '\n\nPossible issues:\n1. Realtime Database Rules not set to true\n2. Database URL incorrect\n3. Network issue'
                            ;
                    });
            } catch (e) {
                log('❌ Firebase init error: ' + e.message, true);
                document.getElementById('detail').innerHTML =
                    '<pre class="error">❌ ' + e.message +
                    '\n\nCommon fixes:\n1. Check Authorized Domains in Firebase Console\n2. Ensure API key is correct\n3. Check project settings'
                    ;
            }
        }

        // Auto run on load
        window.onload = runTest;
    </script>
</body>
</html>
